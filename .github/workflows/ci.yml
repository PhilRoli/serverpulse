name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    uses: PhilRoli/menubar-kit/.github/workflows/ci.yml@v1
    with:
      app: ServerPulse

  agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Agent tests
        run: python3 -m unittest discover -s agent -v
