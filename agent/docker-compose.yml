services:
  agent:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    read_only: true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:4099:5000"
    env_file: .env
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /:/host-root:ro
      - /var/run/docker.sock:/var/run/docker.sock
